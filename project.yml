# XcodeGen specification — equivalent to the committed FITNA.xcodeproj.
# Regenerate with:  xcodegen generate
name: FITNA
options:
  bundleIdPrefix: agency.go360
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  xcodeVersion: "15.0"
  createIntermediateGroups: true
packages:
  FitnaKit:
    path: Packages/FitnaKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  FITNA:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FITNA
    dependencies:
      - package: FitnaKit
    info:
      path: FITNA/Generated/Info.plist
      properties:
        CFBundleDisplayName: فِطنة
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.puzzle-games
        UIAppFonts: [Tajawal-Regular.ttf, Tajawal-Medium.ttf, Tajawal-Bold.ttf, Tajawal-ExtraBold.ttf]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: agency.go360.fitna
        PRODUCT_NAME: FITNA
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
  FITNATests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FITNATests
    dependencies:
      - target: FITNA
      - package: FitnaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: agency.go360.fitna.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  FITNAUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FITNAUITests
    dependencies:
      - target: FITNA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: agency.go360.fitna.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FITNA
schemes:
  FITNA:
    build:
      targets:
        FITNA: all
        FITNATests: [test]
        FITNAUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FITNATests
        - FITNAUITests
    archive:
      config: Release
